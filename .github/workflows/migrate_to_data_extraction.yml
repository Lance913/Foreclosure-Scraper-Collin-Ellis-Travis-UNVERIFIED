name: One-time - move old rows to Data Extraction
on: workflow_dispatch
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import logging, json, os, traceback
          logging.basicConfig(level=logging.INFO)
          try:
              import sheets_writer
              print("::notice::service account = " + json.loads(os.environ['GOOGLE_CREDENTIALS']).get('client_email', '?'))
              sheets_writer.migrate_old_sheet()
              print("::notice::migration done")
          except Exception as e:
              print("::error::" + repr(e)[:900].replace('\n', ' '))
              raise
          PY
